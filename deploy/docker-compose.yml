services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--quiet", "--logpath", "/dev/null"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME}
      DEFAULT_ORG_ID: ${DEFAULT_ORG_ID}
      DEFAULT_ORG_NAME: ${DEFAULT_ORG_NAME:-SIPRO Developer}
      JWT_SECRET: ${JWT_SECRET}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      PORTAL_MASTER_OTP: ${PORTAL_MASTER_OTP}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
      CORS_ORIGINS: https://${DOMAIN}
      COOKIE_SECURE: "true"
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-mongo}
      ENV: production
      BACKUP_DIR: /data/backups
      EMERGENT_LLM_KEY: ${EMERGENT_LLM_KEY:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
      META_PIXEL_ID: ${META_PIXEL_ID:-}
    volumes:
      - backend_backups:/data/backups
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/api/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        REACT_APP_BACKEND_URL: https://${DOMAIN}
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mongo_data:
  backend_backups:
  caddy_data:
  caddy_config:
