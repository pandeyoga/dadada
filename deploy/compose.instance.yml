# Satu instance SIPRO (mongo + backend + frontend). Dipakai per domain lewat deploy/lib.sh:
#   docker compose -p <project> --env-file deploy/instances/<nama>.env -f deploy/compose.instance.yml ...
# HTTPS & routing domain ditangani Caddy bersama di deploy/edge (jaringan docker "sipro_edge").
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--quiet", "--logpath", "/dev/null"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    image: sipro-app-backend:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME}
      DEFAULT_ORG_ID: ${DEFAULT_ORG_ID}
      DEFAULT_ORG_NAME: ${DEFAULT_ORG_NAME:-SIPRO Developer}
      JWT_SECRET: ${JWT_SECRET}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      PORTAL_MASTER_OTP: ${PORTAL_MASTER_OTP}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
      START_EMPTY: ${START_EMPTY:-false}
      CORS_ORIGINS: https://${DOMAIN}
      COOKIE_SECURE: "true"
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-mongo}
      ENV: production
      BACKUP_DIR: /data/backups
      EMERGENT_LLM_KEY: ${EMERGENT_LLM_KEY:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
      META_PIXEL_ID: ${META_PIXEL_ID:-}
    volumes:
      - backend_backups:/data/backups
    expose:
      - "8001"
    networks:
      default:
      edge:
        aliases:
          - ${INSTANCE}-backend
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/api/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  frontend:
    image: sipro-app-frontend:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        REACT_APP_BACKEND_URL: ""
    restart: unless-stopped
    expose:
      - "80"
    networks:
      default:
      edge:
        aliases:
          - ${INSTANCE}-frontend

networks:
  edge:
    external: true
    name: sipro_edge

volumes:
  mongo_data:
  backend_backups:
